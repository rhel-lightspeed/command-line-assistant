name: Require PR labels

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

jobs:
  require-type-label:
    if: ${{ !contains(fromJson('["dependabot", "pre-commit-ci", "renovate"]'), github.actor ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5
        with:
          mode: exactly
          count: 1
          labels: "kind/.*"
          use_regex: true
